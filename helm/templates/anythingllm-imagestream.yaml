---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: anythingllm-workbench
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    opendatahub.io/notebook-image-desc: "AnythingLLM workbench for HR Assistant"
    opendatahub.io/notebook-image-name: "AnythingLLM"
    opendatahub.io/notebook-image-order: "1"
  labels:
    opendatahub.io/notebook-image: "true"
spec:
  lookupPolicy:
    local: true
  tags:
    - name: "1.8.5"
      annotations:
        opendatahub.io/notebook-python-dependencies: "[]"
        opendatahub.io/notebook-software: "[]"
      importPolicy:
        importMode: Legacy
      from:
        kind: DockerImage
        name: "{{ .Values.images.anythingllm }}"
      referencePolicy:
        type: Source
